server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hfnew-backend
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.hfnew.entity
  mapper-locations: classpath:/mapper/**/*.xml

app:
  jwt:
    # 生产环境通过环境变量注入，禁止硬编码
    access-secret: ${APP_JWT_ACCESS_SECRET}
    refresh-secret: ${APP_JWT_REFRESH_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 1209600
    issuer: "hfnew-backend"

  security:
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173}

---
# MySQL 生产 profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:bj-cynosdbmysql-grp-q7xgsuf2.sql.tencentcdb.com}:${MYSQL_PORT:21671}/${MYSQL_DATABASE:hfcc}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

---
# H2 开发 profile
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:hfnew;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data-h2.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
